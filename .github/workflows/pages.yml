name: Documentation compatibility

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Preserve existing documentation addresses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out validated compatibility tools
        uses: actions/checkout@v6
        with:
          repository: PDFToolkit/pdftoolkit.github.io
          ref: 2ce4a81f61fb12b93c0e414e2b98bff0fe8aff6e
          path: _docs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Preserve published downloads and redirect HTML navigation
        run: |
          log="$RUNNER_TEMP/legacy-site-build.log"
          for attempt in 1 2 3; do
            set +e
            python _docs/tools/build_legacy_site.py --site-url https://pdftoolkit.github.io/ --legacy-manifest _docs/resources/legacy-site-manifest.json --legacy-base /pdf --output _site > "$log" 2>&1
            status=$?
            set -e
            cat "$log"
            if [ "$status" -eq 0 ]; then break; fi
            case "$(cat "$log")" in
              *"HTTP Error 429"*|*"HTTP Error 502"*|*"HTTP Error 503"*|*"HTTP Error 504"*) ;;
              *) exit "$status" ;;
            esac
            if [ "$attempt" -eq 3 ]; then exit "$status"; fi
            # A failed download leaves partial output; the pinned builder requires an empty directory.
            python -c 'from pathlib import Path; import shutil; root = Path.cwd().resolve(); output = (root / "_site").resolve(); assert output.parent == root and output.name == "_site", "Unexpected compatibility output"; shutil.rmtree(output) if output.exists() else None'
            sleep "$((attempt * 5))"
          done
          python _docs/tools/check_legacy_site.py _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish compatibility pages and original download bytes
        id: deployment
        uses: actions/deploy-pages@v4
