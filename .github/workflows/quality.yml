name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: 0.6.x-dev

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, zlib, openssl
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: composer audit --locked
      - run: composer check
      - run: python tools/generate_specification.py --check
      - run: python tools/generate_adobe_supplement.py --check
      - run: python tools/generate_iso32000_2_pilot.py --check
      - run: python tools/build_saslprep_tables.py --check
      - run: python -m pip install --require-hashes -r tools/public-key-validation-requirements.txt
      - name: Verify retained archival Adobe references and portfolio attachments
        run: python tools/validate_adobe_references.py
      - name: Verify retained ISO 32000-2 bundle originals
        run: python tools/validate_iso32000_bundle.py
      - uses: ./.github/actions/setup-qpdf
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Generate and validate every example
        run: |
          mkdir -p /tmp/pdf-examples
          for example in examples/*.php; do
            name=$(basename "$example" .php)
            output="/tmp/pdf-examples/$name.pdf"
            php "$example" "$output"
            qpdf --check "$output"
          done
      - name: Verify mechanism semantics with an independent reader
        run: python tools/validate_mechanisms.py /tmp/pdf-examples
      - name: Verify the Adobe source and extension semantics
        run: python tools/validate_adobe_supplement.py /tmp/pdf-examples
      - name: Verify historical encryption and Unicode preparation independently
        run: python tools/validate_adobe_encryption.py --php php --qpdf qpdf
      - name: Verify PDF 2.0 foundations and public-key permission semantics
        run: |
          python tools/validate_pdf20_foundations.py --php php --qpdf qpdf --example /tmp/pdf-examples/pdf20-associated-files.pdf
          python tools/validate_public_key_security.py --php php --pdf-version 2.0
      - name: Verify native source mechanisms with independent oracles
        run: python tools/validate_source_mechanisms.py /tmp/pdf-examples --php php --qpdf qpdf
