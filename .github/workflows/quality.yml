name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, zlib
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: composer audit --locked
      - run: composer check
      - run: python tools/generate_specification.py --check
      - run: python -m pip install --require-hashes -r tools/validation-requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y qpdf
      - name: Generate and validate every example
        run: |
          mkdir -p /tmp/pdf-examples
          for example in examples/*.php; do
            name=$(basename "$example" .php)
            output="/tmp/pdf-examples/$name.pdf"
            php "$example" "$output"
            qpdf --check "$output"
          done
      - name: Verify mechanism semantics with an independent reader
        run: python tools/validate_mechanisms.py /tmp/pdf-examples
