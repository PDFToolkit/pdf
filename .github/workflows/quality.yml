name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, zlib
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
      - run: python tools/generate_specification.py --check
      - run: sudo apt-get update && sudo apt-get install -y qpdf
      - name: Generate and validate every example
        run: |
          mkdir -p /tmp/pdf-examples
          for example in examples/*.php; do
            name=$(basename "$example" .php)
            output="/tmp/pdf-examples/$name.pdf"
            php "$example" "$output"
            qpdf --check "$output"
          done
