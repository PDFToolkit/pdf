name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: 0.8.x-dev
  COMPOSER_MAX_PARALLEL_HTTP: 4
  PDFTOOLKIT_OPENSSL: /usr/bin/openssl

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, iconv, zlib, openssl
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: composer audit --locked
      - run: composer check
      - run: python tools/generate_specification.py --check
      - run: python tools/generate_adobe_supplement.py --check
      - run: python tools/generate_iso32000_2.py --check
      - run: python tools/compile_iso32000_2_catalogue.py --check
      - run: python tools/build_saslprep_tables.py --check
      - run: python -m pip install --require-hashes -r tools/public-key-validation-requirements.txt
      - name: Verify retained archival Adobe references and portfolio attachments
        run: python tools/validate_adobe_references.py
      - name: Verify exact approved EC3 semantic review chains
        run: python tools/validate_ec3_semantic_reviews.py
      - name: Verify retained ISO 32000-2 bundle originals
        run: python tools/validate_iso32000_bundle.py
      - name: Verify reproducible structure inclusion rules
        run: python tools/generate_structure_inclusion.py --check
      - name: Verify source-linked WTPDF requirement coverage
        run: |
          python tools/check_wtpdf_requirements.py
          python -m unittest discover -s tests -p test_wtpdf_requirements.py
      - uses: ./.github/actions/setup-qpdf
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Generate and validate every example
        run: |
          mkdir -p /tmp/pdf-examples
          for example in examples/*.php; do
            name=$(basename "$example" .php)
            output="/tmp/pdf-examples/$name.pdf"
            php "$example" "$output"
            qpdf --check "$output"
          done
      - name: Verify mechanism semantics with an independent reader
        run: python tools/validate_mechanisms.py /tmp/pdf-examples
      - name: Inspect PDF2 simple-font metrics independently
        run: python tools/validate_pdf20_fonts.py /tmp/pdf-examples
      - name: Verify the Adobe source and extension semantics
        run: python tools/validate_adobe_supplement.py /tmp/pdf-examples
      - name: Verify barcode data preparation and native appearance placement
        run: python tools/validate_barcode_appearances.py --php php --qpdf qpdf --pdftoppm pdftoppm --work-dir /tmp/pdf-barcode-appearances
      - name: Verify selected Type3 glyph programs and WTPDF font usage
        run: python tools/validate_wtpdf_type3_usage.py --php php --qpdf qpdf --pdftoppm pdftoppm --work-dir /tmp/pdf-wtpdf-type3
      - name: Verify historical encryption and Unicode preparation independently
        run: python tools/validate_adobe_encryption.py --php php --qpdf qpdf
      - name: Verify PDF 2.0 foundations and public-key permission semantics
        run: |
          python tools/validate_pdf20_foundations.py --php php --qpdf qpdf --example /tmp/pdf-examples/pdf20-associated-files.pdf
          python tools/validate_public_key_security.py --php php --pdf-version 2.0
      - name: Verify native source mechanisms with independent oracles
        run: python tools/validate_source_mechanisms.py /tmp/pdf-examples --php php --qpdf qpdf
      - name: Verify destructive redaction bytes, graph closure and rendered pixels
        run: python tools/validate_secure_redaction.py --php php --qpdf qpdf --work-dir /tmp/pdf17-redaction
      - name: Verify PDF 2.0 metadata, declarations and encrypted payloads independently
        run: python tools/validate_pdf20_metadata.py --php php --qpdf qpdf --work-dir /tmp/pdf20-metadata
      - name: Verify modern encryption, signatures and PDF MAC independently
        run: python tools/validate_iso32000_crypto.py --php php --qpdf qpdf --openssl /usr/bin/openssl --work-dir /tmp/pdf20-crypto
      - name: Verify RFC3161 timestamps and DSS across signed revision histories
        run: python tools/validate_pdf20_timestamps.py --php php --qpdf qpdf --openssl /usr/bin/openssl --work-dir /tmp/pdf20-timestamps
      - name: Verify protected native revisions against independent signature and difference analysis
        run: python tools/validate_incremental_permissions.py --php php --qpdf qpdf --work-dir /tmp/pdf-protected-revisions
      - name: Verify geospatial object relationships and historical revisions
        run: python tools/validate_pdf20_geospatial.py --php php --qpdf qpdf --work-dir /tmp/pdf20-geospatial
      - name: Verify semantic destinations and their fallback pages
        run: python tools/validate_pdf20_structure_destinations.py --php php --qpdf qpdf --work-dir /tmp/pdf20-structure-destinations
      - name: Verify PDF 2.0 namespaces and tagged content independently
        run: python tools/validate_pdf20_tagging.py --php php --qpdf qpdf --example /tmp/pdf-examples/pdf20-tagged-namespaces.pdf
